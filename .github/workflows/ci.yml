name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit and lifecycle tests
        run: swift test

      - name: Build release .app bundle and DMG
        run: |
          chmod +x scripts/build_app.sh
          ./scripts/build_app.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SleepGuard-macOS
          path: |
            dist/*.zip
            dist/*.dmg
