name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run unit and lifecycle tests
        run: swift test

      - name: Build release bundle, ZIP, and DMG
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          chmod +x scripts/build_app.sh
          VERSION="$CLEAN_VERSION" ./scripts/build_app.sh
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            dist/*.dmg \
            dist/*.zip \
            dist/SHA256SUMS.txt \
            --title "SleepGuard ${{ github.ref_name }}" \
            --generate-notes
